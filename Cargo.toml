[package]
name = "my_extension"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
# 这是 DuckDB 的 loadable extension（靠 GitHub Release 上的 .duckdb_extension 分发，
# 见根目录 AGENTS.md 的「发版流程」），不发 crates.io。
#
# A DuckDB loadable extension: it ships as the .duckdb_extension files attached to a GitHub Release
# (see the release flow in AGENTS.md) and is never published to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# 目前无法按 target 覆盖 crate-type：src/wasm_lib.rs 转发到 src/lib.rs，
# 这样原生编译保持 cdylib，Wasm 编译则用 staticlib（真正的链接由 emcc 完成）。
# name 必须与扩展名一致（Justfile 的 build_wasm 拿它当 --example 的参数）。
#
# crate-type can't be (at the moment) be overriden for specific targets:
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc).
# The name must match the extension name (the Justfile's build_wasm passes it to `--example`).
name = "my_extension"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
# duckfn：属性宏框架，把普通 Rust 函数变成 DuckDB 的标量 / 聚合 / 表函数等（见 src/extension/functions/）。
# 依赖用 `all`，一次带齐 duckfn 的大部分可选功能（= duckdb-1-5 + cli + chrono + uuid + rust_decimal），
# 下游项目不必再逐个挑 feature：
#   - duckdb-1-5：DuckDB 1.5 才进 C API 的能力（1.5 的新逻辑类型，以及 COPY 函数那几个 *Info 类型）。
#     本模板的 Makefile 与 CI 都对准 v1.5.5。
#   - cli：src/bin/duckfn.rs 用的命令行工具（导出函数描述 CSV），给 duckfn 带上 clap 与 csv。
#     不用 `just docs_csv` 的话可以删掉 src/bin/duckfn.rs（feature 留着也无妨）。
#   - chrono / uuid / rust_decimal：与 DuckDB 的 DATE/TIMESTAMP、UUID、DECIMAL 互转；用到时把对应
#     的 crate 也加成直接依赖，duckfn 不 re-export 它们。
#
# `all` 里**没有** owned-connection（0.0.15 起）：那一档控制宿主文件系统（`duckfn::duck_vfs`，落盘读写
# 的一行式封装），而它会在扩展加载时留一条进程级常驻连接。宿主文件系统在浏览器 / DuckDB-Wasm 上不可靠，
# native 上 DuckDB 自身的读写与系统库又能替代，所以不放进「全开」这一档，免得每个下游都为用不上的能力
# 付代价。native 场景确实要用时，把它显式加上：`features = ["all", "owned-connection"]`。
#
# duckfn: the attribute-macro framework that turns ordinary Rust functions into DuckDB scalar /
# aggregate / table functions (see src/extension/functions/). The dependency turns on `all`, i.e. most
# optional features at once (= duckdb-1-5 + cli + chrono + uuid + rust_decimal), so a downstream
# project never has to pick features one by one:
#   - duckdb-1-5: what only reached DuckDB's C API in 1.5 (its new logical types, plus the COPY-function
#     *Info types). The Makefile and CI of this template both target v1.5.5.
#   - cli: the command-line tool behind src/bin/duckfn.rs (exports the function-description CSV); it
#     pulls clap and csv into duckfn. Drop src/bin/duckfn.rs if you never run `just docs_csv`.
#   - chrono / uuid / rust_decimal: conversions to and from DuckDB's DATE/TIMESTAMP, UUID and DECIMAL;
#     add the crate itself as a direct dependency when you use one — duckfn re-exports none of them.
#
# `all` deliberately does **not** include `owned-connection` (as of 0.0.15): that one carries the host
# file system (`duckfn::duck_vfs`, whose one-line read/write helpers live there) and keeps a
# process-wide connection alive for as long as the extension is loaded. The host file system is
# unreliable under the browser / DuckDB-Wasm build, and on native DuckDB's own readers and the standard
# library cover the same need, so it stays out of "everything on" rather than charging every downstream
# user for a capability it may never need. Add it explicitly when you do need it on native:
# `features = ["all", "owned-connection"]`.
#
# 0.0.11 起 duckfn 的用户文档正文、示例扩展与 sqllogictest 范例也随这个 crate 发布：跑过一次构建之后
# 它们就在本机 cargo 的解包目录里（`<cargo>/registry/src/*/duckfn-<版本>/`），与这里钉的版本严格对应，
# 不需要 clone duckfn 的 git 仓库。路径与按主题的对照表见 AGENTS.md。
#
# Since 0.0.11 the crate package also carries duckfn's user-guide text, the example extension and its
# SQLLogicTest files: after any build they sit in cargo's unpacked source directory
# (`<cargo>/registry/src/*/duckfn-<version>/`), matching the version pinned here — no duckfn repository
# clone needed. AGENTS.md has the paths and a topic-by-topic map.
duckfn = { version = "0.0.15", features = ["all"] }

# duckfn 本身就建立在下面两个 crate 之上；需要直接使用它们的类型或 builder 时显式加上。
# quack-rs：duckfn_entrypoint! 展开出的代码直接引用 `quack_rs::` 路径，必须显式依赖。
#
# duckfn is built on the two crates below; add them explicitly when you use their
# types or builders directly.
# quack-rs: the code expanded by `duckfn_entrypoint!` refers to `quack_rs::` paths,
# so it must be a direct dependency.
quack-rs = "0.16.0"

# loadable-extension：走 DuckDB 的 API 函数表分发，而不是链接 libduckdb，这也是「无需在本地编译
# DuckDB」的原因（仅使用头文件，不链接库）。版本下限是 DuckDB 1.5：libduckdb-sys 把 DuckDB 版本编码成
# `1.<major*10000 + minor*100 + patch>.0`（1.5.0 → 1.10500.0，1.5.5 → 1.10505.0），
# 于是 `>=1.10500` 就是「DuckDB >= 1.5」。
#
# `loadable-extension` dispatches through DuckDB's API table instead of linking libduckdb — that is what
# keeps a local DuckDB build unnecessary (headers only). The lower bound is DuckDB 1.5: libduckdb-sys
# encodes a DuckDB version as `1.<major*10000 + minor*100 + patch>.0` (1.5.0 → 1.10500.0,
# 1.5.5 → 1.10505.0), so `>=1.10500` means "DuckDB >= 1.5".
libduckdb-sys = { version = ">=1.10500, <2", features = ["loadable-extension"] }

# 用到时间/日期（`DuckDate`、`DuckTimestamp*`…）或 UUID、DECIMAL 的互转时，直接把那个 crate 加成依赖即可
# —— `all` 已经打开了 duckfn 的对应 feature（"chrono" / "uuid" / "rust_decimal"），而 duckfn 不
# re-export 它们。例：
#   chrono = { version = "0.4", default-features = false, features = ["std"] }
#
# When you convert to those types, just add the crate itself as a dependency: `all` has already turned
# on duckfn's matching feature ("chrono" / "uuid" / "rust_decimal"), and duckfn re-exports none of
# them. For example:
#   chrono = { version = "0.4", default-features = false, features = ["std"] }
